<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fdf6ec">
  <title>Your Cart | Home Tiffin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,600;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=1">
  <script src="script.js?v=1" defer></script>
</head>
<body data-page="cart">
  <header id="site-header"></header>
  <main class="page-shell">
    <section class="page-intro page-intro--left reveal">
      <p class="eyebrow">Almost time to eat</p>
      <h1>Your cart</h1>
      <p>Review your picks and choose when they arrive.</p>
    </section>
    <div class="cart-layout">
      <section class="cart-items" id="cart-items" aria-label="Cart items"></section>
      <aside class="summary-card" id="order-summary" aria-label="Order summary"></aside>
    </div>
    <p class="form-message" id="cart-message" role="status" aria-live="polite"></p>
  </main>
  <footer id="site-footer"></footer>
</body>
</html>
